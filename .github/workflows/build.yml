name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build .mpp bundle and generate patches-list.json
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon :patches:buildAndroid generatePatchesList

      - name: Upload patch bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yourwidget-patches-bundle
          path: |
            patches/build/libs/*.mpp
            patches-list.json
